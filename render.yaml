# Blueprint в корне репозитория (Render читает render.yaml отсюда).
services:
  - type: web
    name: calorie-tracker-pro
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: VISION_PROVIDER
        value: mock
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: calorie-tracker-db
          property: connectionString
      - key: FRONTEND_URL
        value: >-
          https://calorie-tracker-pro-smg1.vercel.app,
          https://calorie-tracker-pro-smg1-git-main-al1b1-03s-projects.vercel.app,
          https://calorie-tracker-pro-smg1-qfa2i606k-al1b1-03s-projects.vercel.app,
          http://localhost:5173

databases:
  - name: calorie-tracker-db
    plan: free
    region: frankfurt
    databaseName: calorie_tracker
    user: calorie_tracker
