# Backend + PostgreSQL
#
# Запуск (из папки Backend):
#   docker compose up -d --build
#
# API: http://localhost:3003/api/health
# Postgres с хоста: localhost:5433 (user/pass: postgres/postgres, DB: calorie_tracker)
#
# Разработка с автоперезагрузкой (аналог npm run dev):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  db:
    image: postgres:16-alpine
    container_name: ctp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: calorie_tracker
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d calorie_tracker"]
      interval: 3s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ctp-backend
    ports:
      - "${PORT:-3003}:3003"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3003
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=2048
      HF_HOME: /app/.cache/huggingface
      TRANSFORMERS_CACHE: /app/.cache/huggingface
      DATABASE_URL: postgresql://postgres:postgres@db:5432/calorie_tracker
      JWT_SECRET: ${JWT_SECRET:-calorie-tracker-dev-secret}
      VISION_PROVIDER: ${VISION_PROVIDER:-auto}
      VISION_LOCAL_MODEL: ${VISION_LOCAL_MODEL:-Xenova/clip-vit-base-patch32}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-4o}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL:-gemini-2.0-flash}
      FRONTEND_URL: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  backend_uploads:
