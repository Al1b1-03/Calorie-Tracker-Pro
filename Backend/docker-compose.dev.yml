# Dev overlay: hot reload (node --watch), исходники с диска
services:
  backend:
    build:
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      HF_HOME: /app/.cache/huggingface
      TRANSFORMERS_CACHE: /app/.cache/huggingface
      NODE_OPTIONS: --max-old-space-size=2048
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/calorie_tracker}
      DATABASE_SSL: ${DATABASE_SSL:-auto}
    volumes:
      - ./src:/app/src
      - ./database:/app/database
      - ./scripts:/app/scripts
      - backend_uploads:/app/uploads
